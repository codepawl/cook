name: probe-42
on:
  push:
    branches: [probe-42-lavapipe-cpu]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lavapipe-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers gdb
      - run: node build.mjs
      - name: CPU
        run: |
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -w -E "avx512f|avx512bw|avx512vl" /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          vulkaninfo --summary 2>/dev/null | grep -i -E "deviceName|driverInfo"
      - name: Default
        run: node tools/probe-lavapipe-42.mjs default || true
      - name: Backtrace of the flat trace
        env:
          PROBE_ONLY: uniform
        run: gdb -batch -ex run -ex bt -ex 'info registers rip' -ex 'x/6i $pc' --args node tools/probe-lavapipe-42.mjs gdb 2>&1 | grep -v -E "^\[(New|Thread)|libthread_db" | tail -40
      - name: AVX caps only
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          PROBE_ONLY: tree,uniform
        run: node tools/probe-lavapipe-42.mjs avx || true
      - name: GPU-assisted validation of the flat pick
        env:
          VK_LOADER_LAYERS_ENABLE: '*validation'
          VK_KHRONOS_VALIDATION_DEBUG_ACTION: VK_DBG_LAYER_ACTION_LOG_MSG
          VK_KHRONOS_VALIDATION_REPORT_FLAGS: error,warn
          VK_KHRONOS_VALIDATION_LOG_FILENAME: stdout
          VK_KHRONOS_VALIDATION_VALIDATE_GPU_BASED: GPU_BASED_GPU_ASSISTED
          VK_KHRONOS_VALIDATION_GPUAV_SAFE_MODE: 'true'
          PROBE_ONLY: tree,uniform-bsdf,uniform
          PROBE_WIDTH: '16'
          PROBE_HEIGHT: '12'
          PROBE_SAMPLES: '4'
        run: |
          set +e
          node tools/probe-lavapipe-42.mjs gpuav 2>&1 | grep -v -e "VUID-vkDestroyDevice-device-05137" -e "VUID-StandaloneSpirv-None-10684" | cut -c1-3000 | head -c 60000
          echo "exit ${PIPESTATUS[0]}"
