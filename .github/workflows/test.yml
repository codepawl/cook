name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The pure JavaScript tests. The tests in tests/gpu skip here: the runner has no Vulkan adapter with ray queries.
      - run: node --test
      # Every target of the exports map and bin is in the npm package.
      - run: node tools/check-exports.mjs

  # The Rust crate builds and its unit tests pass. No GPU test runs here.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - run: node tools/check-addon-build-info.mjs target/release/librender_native.so
      - run: node tools/run-cargo-tests.mjs

  # The Cycles lookup tables in luts.rs equal the tables they replaced. Needs the whole history.
  luts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 tools/verify-cycles-luts.py

  # This checkout against the native tests of Crucible that need no addon. Crucible main still carries its own copy of Cook until
  # it depends on this package, so the job may fail for a reason that is not in this change: it is informational
  # (continue-on-error) and becomes required once Crucible main depends on @codepawlhq/cook.
  with-crucible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cook
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codepawl/crucible
          ref: main
          path: crucible
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: crucible
      - name: Put this checkout in place of the installed Cook
        run: |
          rm -rf crucible/node_modules/@codepawlhq/cook
          mkdir -p crucible/node_modules/@codepawlhq
          cp -r cook crucible/node_modules/@codepawlhq/cook
      # Every Crucible test that loads Cook or packs its input runs here. A narrower list let a kernel parameter block that
      # grew from 320 to 336 bytes pass this job while ten Crucible tests failed on it (codepawl/crucible#1279).
      # Tests that need the native addon skip their GPU parts, as they do in Crucible's own unit job.
      - name: Run the Crucible tests that load Cook or pack its input
        working-directory: crucible
        run: |
          mapfile -t files < <(grep -lE "@codepawlhq/cook|render-native|createNativeSession|traceNative|kernelParams" tests/*.test.js | sort)
          echo "Running ${#files[@]} Crucible test files"
          node --test "${files[@]}"

  # A one-sample trace of the room fixture on Mesa lavapipe, the software Vulkan adapter of GitHub's free runners (#37).
  lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lavapipe-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - run: vulkaninfo --summary
      - run: node build.mjs
      - name: Trace the room once with the validation layer logging to stdout
        env:
          VK_LOADER_LAYERS_ENABLE: '*validation'
          VK_KHRONOS_VALIDATION_DEBUG_ACTION: VK_DBG_LAYER_ACTION_LOG_MSG
          VK_KHRONOS_VALIDATION_REPORT_FLAGS: error,warn
          VK_KHRONOS_VALIDATION_LOG_FILENAME: stdout
        run: node bin/cook.mjs render fixtures/room.cookpack --output room.png --width 64 --samples 1 2>&1 | tail -150
