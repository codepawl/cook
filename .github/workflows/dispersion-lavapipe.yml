name: Dispersion on lavapipe

# Renders the dispersion scenes (tools/dispersion-scenes.mjs) on Mesa lavapipe, so the dispersive kernel compiles and runs
# without a GPU, and checks that dispersion 0 renders the same bits as Cook main. No timings: lavapipe is a CPU.
on:
  workflow_dispatch:
  push:
    branches: [46-spectral-dispersion]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: feature
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: node build.mjs
        working-directory: feature
      - run: node build.mjs
        working-directory: base
      - name: Render the scenes with the dispersive kernel
        working-directory: feature
        run: |
          set -eo pipefail
          mkdir -p ../out
          node tools/dispersion-parity.mjs prism-view ../out/prism-view-d1 --samples 256 --dispersion 1 --width 320 --height 180
          node tools/dispersion-parity.mjs gem ../out/gem-d1 --samples 256 --dispersion 1 --width 320 --height 180
          node tools/dispersion-parity.mjs prism-floor ../out/prism-floor-d1 --samples 256 --dispersion 1 --width 240 --height 135
          node tools/dispersion-parity.mjs prism-view ../out/prism-view-d0 --samples 256 --dispersion 0 --width 320 --height 180
          node tools/dispersion-parity.mjs gem ../out/gem-d0 --samples 256 --dispersion 0 --width 320 --height 180
      - name: Dispersion 0 against Cook main, bit for bit
        working-directory: feature
        run: |
          set -eo pipefail
          for scene in gem prism-view prism-floor; do
            node tools/dispersion-parity.mjs $scene ../out/$scene-feature-plain --samples 32 --dispersion 0 --width 160 --height 90
            COOK_ADDON_PATH="$GITHUB_WORKSPACE/base/build/render-native.node" node tools/dispersion-parity.mjs $scene ../out/$scene-base-plain --samples 32 --dispersion 0 --width 160 --height 90
            sha256sum ../out/$scene-feature-plain.cook.npy ../out/$scene-base-plain.cook.npy | tee -a ../out/hashes.txt
            test "$(sha256sum < ../out/$scene-feature-plain.cook.npy)" = "$(sha256sum < ../out/$scene-base-plain.cook.npy)"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dispersion-lavapipe
          path: |
            out/*.png
            out/*.cook.json
            out/hashes.txt
