name: Caustics

# Renders the caustic scenes (tools/make-caustic-scene.mjs) on Mesa lavapipe and uploads the pictures and the numbers. It checks that the
# glass solver compiles and runs, and that light reaches the floor through the glass. Timings are the CPU adapter's, not a GPU's.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/cycles/mnee.wgsl
      - src/cycles/integrator.wgsl
      - tools/make-caustic-scene.mjs
      - tools/measure-caustics.mjs
      - tools/caustics-ci.json
      - tests/gpu/caustics.test.mjs
      - .github/workflows/caustics.yml

permissions:
  contents: read

jobs:
  lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lavapipe-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: node build.mjs
      - name: Caustic tests on the GPU path
        run: node --test tests/gpu/caustics.test.mjs
      - name: Render the caustic scenes
        run: node tools/measure-caustics.mjs caustics-out tools/caustics-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caustics
          path: caustics-out
