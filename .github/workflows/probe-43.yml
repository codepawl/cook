name: probe-43
on:
  push:
    branches: [probe-43-warp-disabled]
jobs:
  warp:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-warp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build with dx12
        run: |
          start=$(date +%s)
          node build.mjs
          echo "BUILD_SECONDS warp $(( $(date +%s) - start ))"
      - name: Fetch WARP and DXC from NuGet
        run: |
          mkdir -p ../nuget-warp ../nuget-dxc
          latest_stable() {
            curl -s "https://api.nuget.org/v3-flatcontainer/$1/index.json" | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8')).versions.filter(x=>!x.includes('-'));console.log(v[v.length-1])"
          }
          warp_version=$(latest_stable microsoft.direct3d.warp)
          dxc_version=$(latest_stable microsoft.direct3d.dxc)
          echo "WARP package $warp_version, DXC package $dxc_version"
          curl -sL -o ../nuget-warp/warp.zip "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$warp_version/microsoft.direct3d.warp.$warp_version.nupkg"
          curl -sL -o ../nuget-dxc/dxc.zip "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/$dxc_version/microsoft.direct3d.dxc.$dxc_version.nupkg"
          (cd ../nuget-warp && unzip -q warp.zip && find . -iname 'd3d10warp.dll')
          (cd ../nuget-dxc && unzip -q dxc.zip && find . -iname 'dxcompiler.dll' -o -iname 'dxil.dll')
          node_directory=$(dirname "$(which node)")
          cp ../nuget-warp/build/native/bin/x64/d3d10warp.dll "$node_directory/"
          cp ../nuget-dxc/build/native/bin/x64/dxcompiler.dll ../nuget-dxc/build/native/bin/x64/dxil.dll "$node_directory/"
          ls -la "$node_directory" | grep -i -E "warp|dxc|dxil"
          powershell -Command "(Get-Item '$node_directory/d3d10warp.dll').VersionInfo | Format-List FileVersion, ProductVersion"
      - name: Probe on WARP
        env:
          COOK_WGPU_BACKEND: dx12
          PROBE_OUT: ${{ github.workspace }}/out/warp
        run: |
          start=$(date +%s)
          node tools/probe-warp-43.mjs warp 2>&1 | tee probe-warp.log
          echo "PROBE_SECONDS warp $(( $(date +%s) - start ))"
      - name: Diagnose the WARP device loss and the missing adapter
        continue-on-error: true
        env:
          COOK_WGPU_BACKEND: dx12
        run: |
          echo "--- tree variant, small dispatches"
          PROBE_ONLY=tree PROBE_SAMPLES=4 PROBE_WIDTH=16 PROBE_HEIGHT=8 node tools/probe-warp-43.mjs warp-tree-small 2>&1 | cut -c1-400
          echo "--- tree variant with the TDR timeout raised"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" //v TdrDelay //t REG_DWORD //d 120 //f || true
          PROBE_ONLY=tree PROBE_SAMPLES=32 node tools/probe-warp-43.mjs warp-tree-tdr 2>&1 | cut -c1-400
          for file in tests/gpu/post.test.mjs tests/gpu/render.test.mjs tests/engine.test.mjs; do
            echo "--- $file alone"
            node --test "$file" 2>&1 | grep -E "^(✖|ℹ (pass|fail))|No DX12|device was lost" | cut -c1-300 | head -20
          done
      - name: npm test on WARP
        env:
          COOK_WGPU_BACKEND: dx12
        continue-on-error: true
        run: |
          mkdir -p out/warp
          start=$(date +%s)
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=out/warp/test.xml 2>&1 | tail -150
          echo "TEST_SECONDS warp $(( $(date +%s) - start ))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: warp
          path: out/warp
  lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lavapipe-dx12-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Build
        run: |
          start=$(date +%s)
          node build.mjs
          echo "BUILD_SECONDS lavapipe $(( $(date +%s) - start ))"
      - name: Probe on lavapipe
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          PROBE_OUT: ${{ github.workspace }}/out/lavapipe
        run: |
          start=$(date +%s)
          node tools/probe-warp-43.mjs lavapipe 2>&1 | tee probe-lavapipe.log
          echo "PROBE_SECONDS lavapipe $(( $(date +%s) - start ))"
      - name: npm test on lavapipe
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        continue-on-error: true
        run: |
          mkdir -p out/lavapipe
          start=$(date +%s)
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=out/lavapipe/test.xml 2>&1 | tail -150
          echo "TEST_SECONDS lavapipe $(( $(date +%s) - start ))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lavapipe
          path: out/lavapipe
  compare:
    needs: [warp, lavapipe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - run: node tools/compare-probe-43.mjs out/warp out/lavapipe
