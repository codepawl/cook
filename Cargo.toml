[package]
name = "render-native"
version = "0.1.0"
edition = "2021"
description = "Cook: a hardware ray traced path tracer with a Cycles-parity kernel, on wgpu and Vulkan ray queries."
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/codepawl/cook"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1"
libloading = "0.8"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
